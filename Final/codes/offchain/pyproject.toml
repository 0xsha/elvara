[project]
name = "elvara-offchain"
version = "0.1.0"
description = "Single-chain intent generator and relay for the Elvara PoC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "hexbytes>=1.3.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "skfolio>=0.16.0",
    "uvicorn>=0.42.0",
    "web3>=7.14.1",
    "yfinance>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
elvara-offchain = "elvara_offchain.cli:main"
elvara-server = "elvara_offchain.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elvara_offchain"]
